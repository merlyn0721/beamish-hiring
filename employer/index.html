function renderTalent(){let people=profileSamples.filter(p=>state.talentFilter==='All'||(state.talentFilter==='Best Match'?p.score>=89:p.availability.includes('Available')||p.availability.includes('available')));if(state.sub==='Shortlist')people=profileSamples.filter(p=>state.shortlisted.includes(p.id));return sectionWrap(heading(state.sub==='Shortlist'?'Your Shortlist':'Discover Talent','Search candidate profiles, see match reasons and keep promising people in one shortlist.',`<button class="btn blue" onclick="navigate('Jobs','Create Job')">Post a Job</button>`)+(state.sub==='Discover Talent'?tabs(['All','Best Match','Available Now'],state.talentFilter,'setTalentFilter'):'')+`<div class="searchRow"><input class="input" id="talentSearch" placeholder="Search role, candidate or skill" oninput="filterTalentCards(this.value)"><button class="btn" onclick="setTalentFilter('Best Match')">Best Match</button><button class="btn">Kuala Lumpur ▾</button><button class="btn">Salary ▾</button></div><div id="talentList" class="grid g3">${people.map(p=>talentCard(p)).join('')||'<div class="card"><h3>No shortlisted candidates yet</h3><p class="fine">Save profiles from Discover Talent.</p></div>'}</div>`)}

function filterTalentCards(q){const el=document.getElementById('talentList');if(!el)return;let match=profileSamples.filter(p=>(p.name+' '+p.role+' '+p.skills).toLowerCase().includes(q.toLowerCase()));if(state.sub==='Shortlist')match=match.filter(p=>state.shortlisted.includes(p.id));el.innerHTML=match.map(p=>talentCard(p)).join('')||'<div class="card">No matching profiles.</div>'}
function renderJobs(){if(state.sub==='Create Job')return sectionWrap(renderJobBuilder());let jobs=state.jobs.filter(j=>state.jobFilter==='All'||j.status===state.jobFilter);return sectionWrap(heading('Manage your jobs','Publish, monitor and manage all openings from one place.',`<button class="btn blue" onclick="navigate('Jobs','Create Job')">+ Create Job</button>`)+tabs(['All','Live','Draft','Closed'],state.jobFilter,'setJobFilter')+`<div class="grid g3">${kpi('Live Jobs',state.jobs.filter(j=>j.status==='Live').length,'Jobs',true)}${kpi('Total Applications','48','Talent')}${kpi('Views this month','1,761','Growth')}</div><div class="card section">${title('Job Listings')}${jobs.map(jobRow).join('')||'<p class="fine">No jobs in this status.</p>'}</div>`)}

function renderJobBuilder(){return heading('Create a Job','Compose the role with optional AI assistance and a transparent market-range preview.',`<button class="btn" onclick="navigate('Jobs','All Jobs')">← All Jobs</button>`)+`<div class="jobLayout"><div class="card"><div class="cardTitle"><strong>Job Details</strong><span class="tag blue">Editable draft</span></div><div class="fgrid"><div class="field"><label>Job Title</label><input class="input" id="jobTitle" value="Marketing Executive"></div><div class="field"><label>Department</label><select class="select" id="jobDept"><option>Marketing</option><option>Creative</option><option>Sales</option><option>Technology</option></select></div><div class="field"><label>Location</label><input class="input" id="jobLocation" value="Kuala Lumpur"></div><div class="field"><label>Work Style</label><select class="select" id="jobType"><option>Hybrid</option><option>On-site</option><option>Remote</option></select></div><div class="field"><label>Experience Level</label><select class="select" id="experience"><option>1–3 years</option><option>Fresh Graduate</option><option>3–5 years</option><option>5+ years</option></select></div><div class="field"><label>Monthly Salary (MYR)</label><input class="input" id="jobPay" value="RM3,500–5,000"></div></div><div class="field"><label>Job Description</label><textarea class="area" id="jobDesc" rows="6">We’re looking for a creative, curious Marketing Executive to join our small, ambitious team. You’ll plan campaigns, work on content and collaborate with designers.</textarea></div><div class="field"><label>Skills / Requirements</label><input class="input" id="jobSkills" value="Content creation, campaign planning, communication"></div><div class="actions"><button class="btn blue" onclick="publishJob('Live')">Publish Job</button><button class="btn" onclick="publishJob('Draft')">Save Draft</button></div></div><div><div class="card"><div class="cardTitle"><strong>✨ AI Job Assist</strong><span class="demo">DEMO SIMULATION</span></div><p class="fine">Use role, location and experience to produce a suggested job draft and indicative salary-range example.</p><button class="btn yellow" style="margin-top:11px;width:100%" onclick="aiAnalyze()">Analyze Market Range</button><div id="aiResult" class="salaryHint" style="margin-top:12px"><div class="eyebrow">Illustrative Salary Range</div><div class="currency" style="margin:5px 0">RM3,500–5,500</div><div class="fine">Demo only · Not a verified salary benchmark</div></div><button class="btn black" style="width:100%;margin-top:11px" onclick="generateJobDraft()">Generate Job Draft</button></div><div class="card section">${title('Live Preview')}<div class="miniTitle" id="previewTitle">Marketing Executive</div><p class="fine">${state.companyName} · Kuala Lumpur · Hybrid</p><span class="tag yellow" style="margin-top:9px">RM3,500–5,000</span><p class="fine" style="margin-top:10px">Your job listing updates when published. Salary guidance is not posted automatically.</p></div></div></div>`}
function aiAnalyze(){const role=jobTitle.value,loc=jobLocation.value;aiResult.innerHTML=`<div class="eyebrow">Illustrative estimate</div><div class="currency" style="margin:6px 0">RM3,500–5,500 / mo</div><p class="fine">${esc(role)} · ${esc(loc)} · 1–3 years</p><div class="line"></div><div class="fine">Source: demonstration scenario, no live salary feed. Confidence and sample size cannot be verified.</div>`;notify('Sample market guidance displayed')}
function generateJobDraft(){jobDesc.value=`We're hiring a ${jobTitle.value} to join North Studio in ${jobLocation.value}.\n\nWhat you'll do:\n• Own campaigns from concept to delivery\n• Collaborate with designers and content creators\n• Monitor performance and report results\n\nWhat we value:\n• Strong communication and attention to detail\n• Initiative, creativity and a willingness to learn`;jobSkills.value='Campaign planning, content creation, analytics, communication';notify('Illustrative job draft generated. Please review before publishing.')}
function publishJob(status){let role=jobTitle.value.trim();if(!role){notify('Enter a job title first');return}state.jobs.unshift({id:Date.now(),role,status,dept:jobDept.value,type:jobType.value,pay:jobPay.value,apps:0,views:0,date:status==='Live'?'30 Nov 2026':'Draft'});persist();navigate('Jobs','All Jobs');notify(role+' saved as '+status)}
function renderHiring(){if(state.sub==='Interviews')return sectionWrap(heading('Interviews','Upcoming interviews and candidate conversations in one schedule.')+`<div class="grid g3">${kpi('Upcoming','3','calendar',true)}${kpi('Completed','7','Hiring')}${kpi('To Schedule','2','Talent')}</div><div class="card section">${title('Upcoming Interviews')}${[['Amanda Lim','Marketing Executive','29 Oct · 2:00 PM','Google Meet'],['Daniel Tan','Graphic Designer','30 Oct · 11:00 AM','Office interview'],['Siti Aina','Marketing Executive','31 Oct · 3:00 PM','Google Meet']].map(a=>`<div class="listrow"><div><div class="miniTitle">${a[0]} · ${a[1]}</div><div class="fine">${a[2]} · ${a[3]}</div></div><button class="btn blue small" onclick="notify('Interview details opened — demo only')">Details</button></div>`).join('')}</div>`);

function renderCompany(){return sectionWrap(state.sub==='Company Page'?heading('Your Company Page','Create a strong employer identity: your story, culture, team and media.',`<button class="btn blue" onclick="saveCompany()">Save Changes</button>`)+`<div class="split"><div class="card"><div class="cardTitle"><strong>Company Page Editor</strong><span class="tag blue">Live preview</span></div><div class="field"><label>Company Name</label><input class="input" id="companyName" value="${esc(state.companyName)}" oninput="updateCompanyPreview()"></div><div class="field"><label>About Your Company</label><textarea class="area" id="companyDesc" oninput="updateCompanyPreview()">${esc(state.companyDescription)}</textarea></div><div class="fgrid"><div class="field"><label>Industry</label><select class="select"><option>Creative & Marketing</option><option>Technology</option><option>Retail</option></select></div><div class="field"><label>Company Size</label><select class="select"><option>11–50 employees</option><option>1–10 employees</option><option>51–200 employees</option></select></div></div><div class="field"><label>Upload Cover (local preview only)</label><input type="file" accept="image/*" onchange="coverUpload(this)"></div><button class="btn blue" onclick="saveCompany()">Save Changes</button></div><div class="card">${title('Company Preview')}<div class="companycover" id="companyCover" style="background-image:url('${state.companyHero||IMG.office}')"></div><div class="companyLogo coverAvatar">NS</div><h2 style="margin:7px 0" id="companyPreviewName">${esc(state.companyName)}</h2><div class="fine">Creative & Marketing · Kuala Lumpur · 11–50 employees</div><p class="smalltext" id="companyPreviewDesc">${esc(state.companyDescription)}</p><div class="line"></div><span class="tag yellow">Hiring</span> <span class="tag blue">3 open jobs</span><div style="margin-top:13px"><button class="btn black" onclick="navigate('Community','Me')">Manage Content →</button></div></div></div><div class="grid g3 section"><div class="card"><div class="eyebrow">CULTURE</div><h3 style="margin:7px 0">Life at North Studio</h3><p class="fine">Show your working style, team activities and office culture.</p><button class="btn link small" onclick="navigate('Community','Me')">Add Story →</button></div><div class="card"><div class="eyebrow">HIRING</div><h3 style="margin:7px 0">3 Open Roles</h3><p class="fine">Marketing Executive, Content Creator and Graphic Designer.</p><button class="btn link small" onclick="navigate('Jobs','All Jobs')">Manage Roles →</button></div><div class="card"><div class="eyebrow">ENGAGEMENT</div><h3 style="margin:7px 0">1.2K Post Views</h3><p class="fine">Demonstration figure for your employer-brand activity.</p><button class="btn link small" onclick="navigate('Growth','Insights')">View Insights →</button></div></div>`:
heading('Posts & Media','Manage employer brand posts, photos, clips and culture updates in one place.',`<button class="btn blue" onclick="openComposer('Company Update')">+ New Company Post</button>`)+`<div class="grid g3"><div class="card zero"><img src="${IMG.office2}" style="height:150px;width:100%;object-fit:cover"><div style="padding:13px"><span class="tag blue">Company Life</span><div class="miniTitle" style="margin-top:8px">Inside North Studio: our creative space</div><p class="fine">1.2K views · 82 reactions</p><button class="btn small" onclick="openComposer('Company Update')">Edit Post</button></div></div><div class="card zero"><img src="${IMG.social3}" style="height:150px;width:100%;object-fit:cover"><div style="padding:13px"><span class="tag blue">Team Story</span><div class="miniTitle" style="margin-top:8px">Meet the people behind our work</div><p class="fine">860 views · 41 reactions</p><button class="btn small" onclick="openComposer('Company Update')">Edit Post</button></div></div><div class="card"><h3>Content Library</h3><p class="fine">Photos, office culture, behind-the-scenes clips, hiring stories and employee testimonials.</p><button class="btn blue" onclick="openComposer('Company Update')">Create Content</button></div></div>`)}
function updateCompanyPreview(){document.getElementById('companyPreviewName').textContent=companyName.value;document.getElementById('companyPreviewDesc').textContent=companyDesc.value}
function coverUpload(el){const file=el.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{state.companyHero=reader.result;document.getElementById('companyCover').style.backgroundImage=`url('${reader.result}')`;notify('Cover preview updated; save to keep changes.')};reader.readAsDataURL(file)}
function saveCompany(){state.companyName=document.getElementById('companyName')?.value||state.companyName;state.companyDescription=document.getElementById('companyDesc')?.value||state.companyDescription;persist();notify('Company profile changes saved locally')}
function socialPostCard(p){let body=p.image?`<img src="${p.image}" alt="Post media">`:(p.img?`<img src="${IMG[p.img]}" alt="Community content">`:`<div class="postVideo">${p.video?'▶':'✍'}<small>${p.video?'0:42 · CAREER CLIP':'WORK TALK'}</small></div>`);return `<article class="post">${body}<div class="postbody"><span class="tag ${p.company?'yellow':'blue'}">${esc(p.type||'Post')}</span><h3>${esc(p.title)}</h3><p>${esc(p.from||'Community member')} · ${esc(p.stats||'New post')}</p><div class="row between"><button class="btn link small" onclick="notify('Liked post — demo only')">♡ Like</button><button class="btn link small" onclick="notify('Share link copied — demo only')">↗ Share</button></div></div></article>`}
const samplePosts=[{img:'social1',title:'“5 signs your interview went well” (and one really didn’t)',from:'Career Roast Club',stats:'12.8K views · 84 comments',type:'Funny / Tips'},{img:'social2',title:'Does your company really need 5 interview rounds?',from:'Siti Aina',stats:'8.1K views',type:'Discussion'},{img:'social3',title:'Behind the scenes: our studio coffee run ☕',from:'North Studio',company:true,stats:'3.1K views',type:'Company Life'},{img:'social4',title:'A day in the life of a content creator',from:'Jason Wong',stats:'6.7K views',type:'Career Clip',video:true},{img:'social5',title:'My portfolio before vs after getting hired',from:'Amanda Lim',stats:'9.4K views',type:'Tutorial'},{img:'social6',title:'Work-life balance: expectation vs reality',from:'Marketing People MY',stats:'4.6K views',type:'Funny'},{video:true,title:'Would you accept RM500 less for hybrid work?',from:'Salary Talk MY',stats:'186 comments',type:'Poll'}];
function renderCommunity(){if(state.sub==='Groups')return sectionWrap(heading('Groups','Industry communities and candid conversations for candidates and employers.')+tabs(['Discover','Joined'],state.communityFilter==='For You'?'Discover':state.communityFilter,'setCommunityFilter')+`<div class="grid g3">${[['Marketing People MY','24.5K members','Content, creative work and marketing life'],['Career Switch Malaysia','38.1K members','Real stories about changing careers'],['First Job Malaysia','52.3K members','Internships, fresh grads and getting started'],['Salary Talk MY','16.8K members','Salary, benefits and pay questions']].map(g=>`<div class="card"><div class="miniTitle">${g[0]}</div><div class="fine">${g[1]}</div><p class="smalltext">${g[2]}</p><button class="btn ${state.following.includes(g[0])?'':'blue'} small" onclick="joinGroup('${g[0]}')">${state.following.includes(g[0])?'✓ Joined':'+ Join'}</button></div>`).join('')}</div>`);
if(state.sub==='Events')return sectionWrap(heading('Community Events','Host and join career fairs, webinars and employer meetups.',`<button class="btn blue" onclick="notify('Event creation — demo only')">+ Host Event</button>`)+`<div class="grid g3">${[['30 OCT','Marketing Career Night','Online · 8:00 PM'],['07 NOV','Beamish Career Discovery Day','Kuala Lumpur · 10:00 AM'],['12 NOV','North Studio Open Day','Our office · 2:00 PM']].map(e=>`<div class="card"><span class="tag yellow">${e[0]}</span><h3>${e[1]}</h3><p class="fine">${e[2]}</p><button class="btn blue small" onclick="notify('RSVP saved — demo only')">RSVP</button></div>`).join('')}</div>`);
if(state.sub==='Career Clips')return sectionWrap(heading('Career Clips','Quick reels: career advice, jokes, industry insights and behind-the-scenes.',`<button class="btn blue" onclick="openComposer('Career Clip')">+ Upload Clip</button>`)+`<div class="grid g3">${samplePosts.filter(p=>p.video||p.type==='Career Clip').concat(samplePosts.slice(0,2)).map(socialPostCard).join('')}</div>`);
if(state.sub==='My Posts')return sectionWrap(heading('My Community Posts','Company content and discussion activity in one place.',`<button class="btn blue" onclick="openComposer('Company Update')">+ New Post</button>`)+`<div class="grid g3">${state.posts.length?state.posts.map(socialPostCard).join(''):'<div class="card"><h3>No new demo posts yet</h3><p class="fine">Click New Post to draft a company update, story, question or clip.</p></div>'}${socialPostCard(samplePosts[2])}</div>`);
return sectionWrap(heading('Community Home','A social space for hiring, real work stories, advice, jokes and career content.',`<button class="btn" onclick="navigate('Community','Groups')">Browse Groups</button>`)+`<div class="card" style="margin-bottom:12px"><div class="socialComposer"><div class="companyLogo" style="width:38px;height:38px;border-radius:50%;font-size:13px;flex:none">NS</div><button class="btn" style="flex:1;text-align:left;border-radius:99px;color:#747880" onclick="openComposer('Post')">What's happening at work? Share something...</button></div><div class="composerActions"><button class="btn small" onclick="openComposer('Photo')">▧ Photo</button><button class="btn small" onclick="openComposer('Career Clip')">▶ Video / Clip</button><button class="btn small" onclick="openComposer('Question')">? Question</button><button class="btn small" onclick="openComposer('Poll')">▤ Poll</button></div></div><div class="row between" style="margin:13px 0 10px"><div class="row"><b style="font-size:12px">Trending</b> <span class="tag blue">#OfficeLife</span><span class="tag blue">#SalaryTalk</span><span class="tag blue">#CareerRoast</span></div><span class="fine desktopOnly">For You · Latest · Following</span></div><div class="feed">${[...state.posts,...samplePosts].map(socialPostCard).join('')}</div>`)}

function joinGroup(g){if(state.following.includes(g))state.following=state.following.filter(x=>x!==g);else state.following.push(g);persist();render();notify('Group preferences updated')}
function openComposer(type='Post'){openDrawer('COMMUNITY','Create '+type,`<div class="notice">Employer posts can be funny, educational, candid or promotional. Be respectful: no harassment or personal targeting.</div><div class="field" style="margin-top:15px"><label>Post Type</label><select class="select" id="postType"><option ${type==='Post'?'selected':''}>Post</option><option ${type==='Company Update'?'selected':''}>Company Update</option><option ${type==='Photo'?'selected':''}>Photo</option><option ${type==='Career Clip'?'selected':''}>Career Clip</option><option ${type==='Question'?'selected':''}>Question</option><option ${type==='Poll'?'selected':''}>Poll</option></select></div><div class="field"><label>Headline</label><input id="postTitle" class="input" placeholder="What would you like to share?"></div><div class="field"><label>Your post</label><textarea id="postBody" class="area" placeholder="Share a story, opinion, tutorial or company update..."></textarea></div><div class="field"><label>Attach Photo (optional)</label><input type="file" id="postImage" accept="image/*"></div><div class="actions"><button class="btn blue" onclick="savePost()">Publish to Community</button><button class="btn" onclick="closeDrawer()">Cancel</button></div>`)}

function uploadControl(title,kind){return `<label class="uploadButton">＋ ${esc(title)}<input type="file" accept="image/*" ${kind==='gallery'?'multiple':''} onchange="uploadEV2('${kind}',this)"></label>`}
function saveValues(mapping,target){mapping.forEach(([id,key])=>{const el=document.getElementById(id);if(el)target[key]=el.value.trim()})}
function resizeImage(file,fn){if(!file||!file.type.startsWith('image/')){notify('Choose an image file');return}if(file.size>10e6){notify('Please choose an image under 10 MB');return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=960,scale=Math.min(1,max/Math.max(im.width,im.height));const can=document.createElement('canvas');can.width=Math.max(1,Math.round(im.width*scale));can.height=Math.max(1,Math.round(im.height*scale));can.getContext('2d').drawImage(im,0,0,can.width,can.height);fn(can.toDataURL('image/jpeg',.76))};im.src=r.result};r.readAsDataURL(file)}
function uploadEV2(kind,input){const files=[...input.files];if(!files.length)return;if(kind==='gallery'){files.slice(0,5).forEach(file=>resizeImage(file,data=>{EV2.company.gallery.push(data);EV2.company.gallery=EV2.company.gallery.slice(0,5);saveEV2();render()}));return}resizeImage(files[0],data=>{if(kind==='personalAvatar'||kind==='personalCover')EV2.person[kind==='personalAvatar'?'avatar':'cover']=data;else if(kind==='companyLogo')EV2.company.logo=data;else if(kind==='companyCover'){state.companyHero=data;EV2.company.cover=data;}saveEV2();persist();render();notify('Image updated in your local preview')})}

 {id:'nova',name:'Nova Tech',industry:'Technology',size:'201–500 employees',location:'Kuala Lumpur',jobs:12,kind:'Technology',image:'company2',about:'Build meaningful digital products with collaborative teams and flexible ways of working.',tags:['Technology','Hybrid','Learning'],latest:'New Product Designer and Data Analyst vacancies'},
 {id:'food',name:'Food Haus',industry:'F&B / Lifestyle',size:'51–200 employees',location:'Petaling Jaya',jobs:5,kind:'F&B',image:'company3',about:'A growing lifestyle and hospitality company with a people-first team culture.',tags:['F&B','On-site','Lifestyle'],latest:'Our team shared a behind-the-scenes career clip'},
 {id:'lumen',name:'Lumen Creative',industry:'Creative & Marketing',size:'11–50 employees',location:'Subang Jaya',jobs:4,kind:'Creative',image:'company1',about:'An independent creative house connecting stories, design and talented makers.',tags:['Creative','Design','Hybrid'],latest:'Lumen is hosting a portfolio workshop'},
 {id:'atlas',name:'Atlas Labs',industry:'Technology',size:'51–200 employees',location:'Cyberjaya',jobs:8,kind:'Technology',image:'office2',about:'Technology studio creating new tools and learning opportunities for early-career talent.',tags:['Technology','Engineering','Flexible'],latest:'Atlas Labs announced a new internship programme'},
 {id:'bright',name:'BrightHire',industry:'HR & Recruitment',size:'11–50 employees',location:'Kuala Lumpur',jobs:3,kind:'HR',image:'social3',about:'Recruitment and people advisory firm helping organisations grow with great teams.',tags:['HR','People','On-site'],latest:'BrightHire shared new interview tips'},
 {id:'horizon',name:'Horizon Retail',industry:'Retail & Consumer',size:'201–500 employees',location:'Shah Alam',jobs:10,kind:'Retail',image:'office',about:'Customer-first consumer business offering retail, merchandising and operations careers.',tags:['Retail','Sales','Growth'],latest:'New retail management opportunities posted'}
];
let v3Followed=(()=>{try{return JSON.parse(localStorage.getItem(BEAMISH_V3_FOLLOW_KEY)||'["nova","lumen"]')}catch(e){return ['nova','lumen']}})();
let v3CompanyFilter='All';let v3CompanyQuery='';
function v3FollowCompany(id){
  v3Followed=v3Followed.includes(id)?v3Followed.filter(x=>x!==id):[...v3Followed,id];
  try{localStorage.setItem(BEAMISH_V3_FOLLOW_KEY,JSON.stringify(v3Followed))}catch(e){}
  render();notify(v3Followed.includes(id)?'Company followed — updates added to Following':'Company unfollowed');
}
function v3OpenCompany(id){
 const c=COMPANY_PUBLIC_DIRECTORY.find(x=>x.id===id);if(!c)return;
 openDrawer('COMPANY DISCOVERY',c.name,`<div class="discoveryArtwork company-${c.id}" style="height:185px;border-radius:12px"><div class="artMark">${esc(c.name.split(' ').map(x=>x[0]).join(''))}</div><div class="artLabel">${esc(c.industry)}</div></div><div class="identityNote" style="margin:13px 0">This is another employer’s public company page, not your own company editor.</div><div class="miniTitle">${esc(c.industry)}</div><p class="smalltext">${esc(c.location)} · ${esc(c.size)}</p><p class="smalltext">${esc(c.about)}</p><div class="row" style="flex-wrap:wrap;margin:12px 0">${c.tags.map(t=>`<span class="tag blue">${esc(t)}</span>`).join('')}<span class="tag yellow">${c.jobs} open roles</span></div><div class="card" style="padding:13px"><b>Latest public update</b><p class="smalltext">${esc(c.latest)}</p></div><div class="actions" style="margin-top:13px"><button class="btn blue" onclick="v3FollowCompany('${c.id}');closeDrawer()">${v3Followed.includes(id)?'Following ✓':'Follow Company'}</button><button class="btn" onclick="closeDrawer();navigate('Company','Following')">Following List</button></div>`);
}
function v3CompanyCard(c){return `<article class="discoveryCard"><div class="discoveryArtwork company-${c.id}"><div class="artMark">${esc(c.name.split(' ').map(x=>x[0]).join(''))}</div><div class="artLabel">${esc(c.industry)}</div></div><div class="discoveryBody"><span class="tag blue">${esc(c.industry)}</span><h3>${esc(c.name)}</h3><p>${esc(c.location)} · ${esc(c.size)}</p><div class="row" style="align-items:center;justify-content:space-between"><span class="tag yellow">${c.jobs} open roles</span><span class="fine">${esc(c.kind)}</span></div><p style="min-height:48px">${esc(c.about)}</p><div class="discoveryFooter"><button class="btn blue small" onclick="v3OpenCompany('${c.id}')">View Company</button><button class="btn small" onclick="v3FollowCompany('${c.id}')">${v3Followed.includes(c.id)?'✓ Following':'+ Follow'}</button></div></div></article>`}
function v3SetCompanyFilter(f){v3CompanyFilter=f;render()}
function v3SearchCompanies(q){v3CompanyQuery=q;render()}
function renderCompanyV3(){
 const following=state.sub==='Following';const base=following?COMPANY_PUBLIC_DIRECTORY.filter(c=>v3Followed.includes(c.id)):COMPANY_PUBLIC_DIRECTORY;
 const filtered=base.filter(c=>(v3CompanyFilter==='All'||c.kind===v3CompanyFilter)&&(c.name+' '+c.industry+' '+c.location+' '+c.about).toLowerCase().includes(v3CompanyQuery.toLowerCase()));
 return sectionWrap(heading(following?'Companies You Follow':'Discover Companies',following?'Follow companies to keep track of new jobs, culture updates and career events.':'Explore other employers and their public company pages. Your own company profile is managed under Profile.',`<button class="btn ${following?'':'blue'}" onclick="navigate('Company','${following?'Discover Companies':'Following'}')">${following?'Discover Companies':'View Following ('+v3Followed.length+')'}</button>`)+
 `<div class="discoveryNote"><b>Clear ownership:</b> Company = explore other companies. Profile = manage your own public employer profile. Community = post and engage.</div>
 <div class="companySearch"><input class="input" id="companyDirectoryQuery" placeholder="Search companies, locations or industries" value="${esc(v3CompanyQuery)}" onkeydown="if(event.key==='Enter')v3SearchCompanies(this.value)"><button class="btn blue" onclick="v3SearchCompanies(document.getElementById('companyDirectoryQuery').value)">Search</button><button class="btn" onclick="v3CompanyQuery='';v3CompanyFilter='All';render()">Reset</button></div>
 ${tabs(['All','Technology','Creative','F&B','Retail','HR'],v3CompanyFilter,'v3SetCompanyFilter')}
 ${filtered.length?`<div class="companyDiscovery">${filtered.map(v3CompanyCard).join('')}</div>`:`<div class="companyEmpty">${following?'No followed companies match these filters. Discover and follow companies to build your list.':'No companies match these filters.'}<div style="margin-top:10px"><button class="btn blue" onclick="v3CompanyQuery='';v3CompanyFilter='All';navigate('Company','Discover Companies')">Discover Companies</button></div></div>`}`);
}
function renderProfileV3(){
 const isPublic=state.sub==='Public Profile';
 if(isPublic)return sectionWrap(heading('Public Profile','Your company’s public employer identity, as candidates can see it on Beamish.',`<button class="btn blue" onclick="navigate('Profile','Profile Studio')">Edit in Profile Studio</button>`)+
 `<div class="identityNote"><b>Owned by ${esc(EV2.company.name)}.</b> This employer profile is yours to publish and manage. To explore other businesses, open Company → Discover Companies.</div>
 <div class="profileStudio"><div class="card"><div class="editorTitle">Public employer profile</div><div class="manageList"><div class="manageRow"><div class="squareIcon">▣</div><div class="grow"><b>${esc(EV2.company.name)}</b><small>${esc(EV2.company.industry)} · ${esc(EV2.company.location)}</small></div><span class="tag green">Published demo</span></div><div class="manageRow"><div class="squareIcon">◉</div><div class="grow"><b>${state.jobs.filter(j=>j.status==='Live').length} active jobs</b><small>Managed inside Hiring → All Jobs</small></div><button class="btn small" onclick="navigate('Hiring','All Jobs')">View</button></div><div class="manageRow"><div class="squareIcon">▤</div><div class="grow"><b>Community activity</b><small>Stories, team posts, videos and engagement</small></div><button class="btn small" onclick="navigate('Community','Me')">Manage</button></div><div class="manageRow"><div class="squareIcon">✎</div><div class="grow"><b>Personal recruiter account</b><small>${esc(EV2.person.name)} · ${esc(EV2.person.role)}</small></div><button class="btn small" onclick="navigate('Settings','Account')">Settings</button></div></div></div><div class="card"><div class="previewToolbar"><b>Candidate-facing preview</b>${devices('company')}</div><div class="previewCanvas" id="companyPreviewCanvas">${companyPreview()}</div></div></div>`);
 return sectionWrap(heading('Profile Studio','Edit your own company profile: name, logo, photos, story, culture and appearance with a live preview.',`<button class="btn blue" onclick="saveCompanyStudioV2()">Save Profile</button>`)+
 `<div class="identityNote">All public employer branding lives here—not in Company discovery. Your personal name, email and security stay in Settings → Account.</div>
 <div class="profileStudio"><div class="card editorCard"><div class="editorTitle">Your public employer identity</div>${field('Company Name','evCompanyName',EV2.company.name)}${field('About Your Company','evCompanyAbout',EV2.company.description,'textarea')}<div class="inlinePair">${inputSelect('Industry','evCompanyIndustry',EV2.company.industry,['Creative & Marketing','Technology','Retail','Finance','F&B / Hospitality','Education','Other'])}${inputSelect('Company Size','evCompanySize',EV2.company.size,['1–10 employees','11–50 employees','51–200 employees','201–500 employees','500+ employees'])}</div><div class="inlinePair">${field('Location','evCompanyLocation',EV2.company.location)}${field('Website','evCompanyWebsite',EV2.company.website)}</div>${field('Culture & Values','evCompanyCulture',EV2.company.culture,'textarea')}<div class="uploadRow">${uploadControl('Company Logo','companyLogo')}${uploadControl('Cover Image','companyCover')}${uploadControl('Culture Photos','gallery')}</div><p class="editorHelp">Preview changes while typing. Uploaded images are saved only in this browser. The public-page publishing backend is not connected.</p><div class="actions"><button class="btn blue" onclick="saveCompanyStudioV2()">Save Profile</button><button class="btn" onclick="navigate('Profile','Public Profile')">See Public Profile</button></div></div><div class="card"><div class="previewToolbar"><div><b>Live employer profile preview</b><div class="fine">Website and mobile</div></div>${devices('company')}</div><div class="previewCanvas" id="companyPreviewCanvas">${companyPreview()}</div></div></div>`);
}
function navigate(c,sub){
 // Compatibility with older buttons and internal workflows.
 if(c==='Jobs'){c='Hiring';sub=sub||'All Jobs'}
 if(c==='Hiring')sub=sub||'All Jobs';
 if(c==='Company'&&['Public Company Page','Company Studio','Company Page','Posts & Media'].includes(sub)){
   if(sub==='Posts & Media'){c='Community';sub='Me'} else{c='Profile';sub=sub==='Company Studio'?'Profile Studio':'Public Profile'}
 }
 if(c==='Profile'&&(!sub||sub==='My Profile'))sub='Public Profile';
 if(!NAV[c])c='Overview';
 state.section=c;state.sub=(sub&&NAV[c].includes(sub))?sub:NAV[c][0];state.tab='All';state.search='';state.jobFilter='All';state.talentFilter='All';state.communityFilter='For You';
 try{history.replaceState(null,'',location.pathname+'?page='+encodeURIComponent(c)+'&sub='+encodeURIComponent(state.sub))}catch(e){}
 toggleMore(false);render();scrollView.scrollTo(0,0)
}

 sideNav.innerHTML=Object.keys(NAV).map(navBtn).join('');
 bottomNav.innerHTML=['Overview','Talent','Hiring','Community','More'].map(c=>`<button class="${state.section===c?'active':''}" onclick="${c==='More'?'toggleMore(true)':`navigate('${c}')`}">${icon(c==='More'?'more':c)}<span>${c==='Overview'?'Home':c}</span></button>`).join('');

}

 searchIcon.innerHTML=icon('search');noticeBtn.innerHTML=icon('bell')+'<span class="dot"></span>';
 let body=state.section==='Overview'?renderOverview():state.section==='Talent'?renderTalent():state.section==='Hiring'?(state.sub==='All Jobs'||state.sub==='Create Job'?renderJobs():renderHiring()):state.section==='Company'?renderCompanyV3():state.section==='Community'?renderCommunityV2():state.section==='Growth'?renderGrowth():state.section==='Workspace'?renderWorkspaceV2():state.section==='Profile'?renderProfileV3():renderSettingsV2();
 view.innerHTML=body;document.title='Beamish Employer Portal — '+state.section;
}
function companyPreview(){
 const c=EV2.company,cover=c.cover||state.companyHero||'';const initials=c.name.split(' ').map(x=>x[0]).slice(0,2).join('');
 const photo=cover?`<div class="showcaseCover" style="background-image:url('${cover}')"></div>`:`<div class="showcaseBrandCover"><div class="coverText">${esc(c.name)}</div></div>`;
 const gallery=c.gallery.length?c.gallery.map(x=>`<img src="${x}" alt="Culture photo">`).join(''):['Our culture','Our team','Our work'].map(x=>`<div class="imagePlaceholder">${x}</div>`).join('');
 return `<div class="previewFrame ${EV2.companyDevice==='mobile'?'phone':''}">${photo}<div class="showcaseDetails"><div class="showcaseLogo" style="${c.logo?`background-image:url('${c.logo}')`:''}">${c.logo?'':esc(initials)}</div><h2>${esc(c.name)}</h2><div class="fine">${esc(c.industry)} · ${esc(c.location)} · ${esc(c.size)}</div><p>${esc(c.description)}</p><p style="margin-top:7px"><b>Culture:</b> ${esc(c.culture)}</p><span class="tag yellow">Now hiring</span> <span class="tag blue">${state.jobs.filter(j=>j.status==='Live').length} open jobs</span><div class="showcaseGallery">${gallery}</div><div class="detailFoot"><button class="btn blue small" onclick="navigate('Hiring','All Jobs')">View Open Roles</button></div></div></div>`
}
// Upgrade any stale bookmarked route to the new sitemap.
if(state.section==='Jobs'){state.section='Hiring';state.sub=['All Jobs','Create Job'].includes(state.sub)?state.sub:'All Jobs'}
if(state.section==='Company'&&!NAV.Company.includes(state.sub)){state.section='Profile';state.sub='Public Profile'}
