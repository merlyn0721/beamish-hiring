function drawHeroResult(){const a=heroAnswers.join('|');let n='THE ALL-ROUNDER',desc='You enjoy variety and might thrive in flexible, cross-functional work.',roles=['Operations Executive','Marketing Executive','Management Trainee'];if(/creative|create/.test(a)){n='THE CREATIVE CONNECTOR';desc='You connect ideas, people and stories in exciting ways.';roles=['Social Media Creative','Content Creator','Marketing Executive']}else if(/people|social|money/.test(a)){n='THE PEOPLE MAGNET';desc='You get energy from people, relationships and momentum.';roles=['Business Development','Sales Executive','Talent Consultant']}else if(/organiser|solve|builder/.test(a)){n='THE GET-IT-DONE PERSON';desc='You like solving problems and making things happen.';roles=['Operations Executive','Project Coordinator','Account Executive']}document.getElementById('heroQuickBody').innerHTML=`<div class="bsx-result"><span class="section-kicker" style="color:#e5df00">YOUR BEAMISH WORK VIBE</span><h3>${n}</h3><p>${desc}</p><div class="bsx-actions">${roles.map(r=>`<span class="chip chip-yellow">${r}</span>`).join('')}</div><div class="bsx-actions"><button class="btn btn-yellow" onclick="go('jobs')">Browse Matching Roles →</button><a href="../auth/signup.html?role=candidate" class="btn" style="color:#111">Create Candidate Account</a><button class="btn" onclick="openHeroMatcher()">Try Again ↻</button></div></div><p class="small muted" style="margin-top:10px">Illustrative results only, not a scientifically validated assessment.</p>`}
