const $=x=>document.getElementById(x);const pic=(n)=>IMG[n]||IMG.office;
function save(){try{localStorage.setItem('beamish_v4',JSON.stringify({savedJobs:S.savedJobs,following:S.following,joined:S.joined,events:S.events,likes:S.likes,profile:S.profile,settings:S.settings}))}catch(e){}}
function goto(page,sub){S.page=page;S.sub=sub||NAV[page][0];S.tab='For You';S.filter='';S.menu=false;render();$('mainScroll').scrollTop=0;}
function subTo(sub){S.sub=sub;S.filter='';render();$('mainScroll').scrollTop=0;}
function tabTo(name,kind='tab'){S[kind]=name;renderContent();}
function wrapCard(inner,cls=''){return `<div class="card ${cls}">${inner}</div>`}
function button(text,fn='',type=''){return `<button class="btn ${type}" onclick="${fn}">${text}</button>`}
function chips(strings){return strings.map(s=>`<span class="tag">${s}</span>`).join('')}
function title(text,sub='',action=''){return `<div class="sectionhead"><div><div class="eyebrow">BEAMISH / ${S.page.toUpperCase()}</div><h1>${text}</h1><p>${sub}</p></div><div class="actions">${action}</div></div>`}
function strip(titles,active,fn,lined=false){return `<div class="${lined?'tabsLine':'tabbar'}">${titles.map(t=>`<button class="${active===t?'sel':''}" onclick="${fn}('${t.replaceAll("'","\\'")}')">${t}</button>`).join('')}</div>`}
function jobRow(j,showSave=true){const on=S.savedJobs.includes(j.id);return `<div class="job"><img class="jobImg" src="${pic(j.img)}"><div class="jobText"><span class="chip yellow">✦ ${j.match}% Match</span><h3>${j.role}</h3><p>${j.co} · ${j.place} · ${j.mode}</p><p>▣ ${j.pay}</p></div><div class="jobSide">${button('View Job',`jobDetail(${j.id})`,'black small')}${showSave?button(on?'♥ Saved':'♡ Save',`saveJob(${j.id})`,'small'):''}</div></div>`}
function appRow(a,full=false){const steps=['Applied','Viewed','Shortlisted','Interview'];const pos=steps.indexOf(a.stage);return `<div class="appRow"><div class="bubble">${a.co.split(' ').map(w=>w[0]).join('').slice(0,2)}</div><div><strong>${a.role}</strong><small>${a.co} · ${a.date}</small><div class="stages">${steps.map((x,i)=>(i?`<span class="${pos>=i?'done':''}"></span>`:'')+`<i class="${pos>=i?'done':''}" title="${x}"></i>`).join('')}</div><div class="stagesLabels">${steps.map(x=>`<span>${x}</span>`).join('')}</div></div>${button(a.stage==='Interview'?'Interview':'Details',`applicationDetail('${a.role}')`,'small '+(a.stage==='Interview'?'blue':''))}</div>`}
function kpi(num,label,icon,go,featured=false){return `<div class="card kpi ${featured?'featured':''}" role="button" tabindex="0" onclick="${go}"><div class="kpiIcon">${icon}</div><div><strong>${num}</strong><span>${label}</span></div></div>`}
function miniMatch(){return `<div class="card"><div class="cardTitle">◎ Your Career Match</div><b style="font-size:19px">Brand & Content</b>${[['Marketing',92],['Content',87],['Employer Branding',81]].map(([x,v])=>`<div class="matchLine"><span>${x}</span><div class="progress"><i style="width:${v}%"></i></div><strong>${v}%</strong></div>`).join('')}${button('View My Match →',"goto('Career Match','My Match')",'ghost')}</div>`}
function profileMini(){return `<div class="card profileMini"><img class="photoavatar" src="${pic('avatar')}"><h3>${S.profile.name}</h3><div class="tiny">${S.profile.headline}</div><div class="tiny">⌖ ${S.profile.location}</div><div class="progress"><i style="width:92%"></i></div><b style="font-size:10px">92% Profile Complete</b><p style="font-size:10px;text-align:left;margin-top:19px;font-weight:900">Skills</p><div style="text-align:left">${chips(S.profile.skills.split(',').map(t=>t.trim()))}</div><p style="font-size:10px;text-align:left;margin:17px 0">🟢 Open to opportunities</p>${button('Edit Profile',"goto('Profile','Profile Studio')",'black')}${button('View Public Profile',"goto('Profile','Public Profile')")}</div>`}

function openImage(file,done,max=1100){if(!file)return;const reader=new FileReader();reader.onload=()=>{if(file.type.startsWith('video/')){done(URL.createObjectURL(file),true);return}const image=new Image();image.onload=()=>{const scale=Math.min(1,max/Math.max(image.width,image.height));const cvs=document.createElement('canvas');cvs.width=Math.max(1,Math.round(image.width*scale));cvs.height=Math.max(1,Math.round(image.height*scale));cvs.getContext('2d').drawImage(image,0,0,cvs.width,cvs.height);done(cvs.toDataURL('image/jpeg',.78),false)};image.src=reader.result};reader.readAsDataURL(file)}
